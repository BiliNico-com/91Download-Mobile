name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    # 需要多取几条历史：Release 说明要跳过 chore(release)，往前找真正的功能提交。
    - uses: actions/checkout@v4
      with:
        fetch-depth: 20
    
    # 固定 JDK 17：ubuntu-latest 默认已升到 JDK 25，而 Gradle 7.5
    # 无法解析 class file major version 69，会直接 build 失败。
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.0'
        channel: 'stable'
    
    - name: Generate platform files
      run: flutter create . --platforms android --project-name download_91 --org com.bilinico
    
    # 构建配置直接使用仓库中的 android/ 源码，不在 CI 里用 heredoc 重写。
    # 历史问题：heredoc 版的 MainActivity.kt 与仓库版长期不同步，导致
    # v1.0.6 ~ v1.3.2 的所有 Release APK 都缺少亮度调节与打开目录两个原生通道
    # （PipPlugin / BrightnessPlugin 也被重复生成）。改为以仓库为准，二者不再分叉。
    - name: Verify Android sources
      run: |
        test -f android/app/build.gradle
        test -f android/settings.gradle
        test -f android/build.gradle
        test -f android/gradle.properties
        test -f android/app/release.keystore
        test -f android/gradle/wrapper/gradle-wrapper.properties
        test -f android/app/src/main/kotlin/com/bilinico/download_91/MainActivity.kt
        test -f android/app/src/main/kotlin/com/bilinico/download_91/FloatingWindowService.kt
        test -f android/app/src/main/kotlin/com/bilinico/download_91/PipPlugin.kt
        echo "Android sources OK"

    - name: Sync version with CI run_number
      id: version
      run: |
        # pubspec.yaml 是版本号的唯一真实来源。
        # CI 只覆写 build number（+N），MAJOR.MINOR.PATCH 由开发者手动维护，
        # 这样 tag、APK 内嵌版本、检查更新的比较基准三者才能保持一致。
        RUN_NUM="${{ github.run_number }}"

        # 读取 pubspec 里开发者维护的版本号（形如 1.0.6+6 或 1.0.6）
        RAW_VERSION=$(grep '^version:' pubspec.yaml | head -1 | sed 's/^version: *//' | tr -d '\r')
        BASE_VERSION=$(echo "$RAW_VERSION" | cut -d'+' -f1)
        echo "base_version=$BASE_VERSION" >> $GITHUB_OUTPUT
        echo "build_number=$RUN_NUM" >> $GITHUB_OUTPUT

        # 同步 build number 到 pubspec，使 APK 内嵌版本与 tag 完全一致
        sed -i "s/^version: \(.*\)+[0-9]*/version: \1+${RUN_NUM}/" pubspec.yaml
        echo "Version synced to: $(grep '^version:' pubspec.yaml)"

        # version.json 已废弃（检查更新改用 Release API），不再写入。
        echo "Release tag will be: v${BASE_VERSION}.${RUN_NUM}"

    - name: Install dependencies
      run: flutter pub get
    
    - name: Build APK
      run: flutter build apk --release
    
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-release.apk
    
    - name: Extract release notes
      id: release_notes
      run: |
        # Release 说明只取本次提交的**首行**（提交标题），保持简短。
        # 提交正文往往是给开发者看的实现细节，不适合直接放进更新日志。
        # 如需更详细的说明，可在提交标题里写清楚（一行以内）。
        # 跳过 chore(release) 版本提交：按 VERSIONING.md，每次发布的最后一条提交
        # 都是「chore(release): 发布 X.Y.Z」，直接取它会让每个 Release 的说明
        # 都退化成「发布 X.Y.Z」。这里往前找第一条非 release 的提交。
        SUBJECT=""
        FIRST=""
        while IFS= read -r LINE; do
          LINE=$(printf '%s' "$LINE" | tr -d '\r')
          [ -z "$FIRST" ] && FIRST="$LINE"
          case "$LINE" in
            chore\(release\)*) continue ;;
          esac
          SUBJECT="$LINE"
          break
        done <<< "$(git log -20 --pretty=format:'%s')"
        # 全是 chore(release) 时退回最新一条，避免说明变成空
        if [ -z "$SUBJECT" ]; then
          SUBJECT="$FIRST"
        fi
        if [ -z "$SUBJECT" ]; then
          SUBJECT="日常更新"
        fi

        # 去掉 conventional commit 前缀（fix: / feat: / chore: 等）
        SUBJECT=$(echo "$SUBJECT" | sed -E 's/^(fix|feat|chore|docs|style|refactor|perf|test|build|ci|revert)(\([^)]*\))?!?:[[:space:]]*//I')

        echo "notes<<EOF" >> $GITHUB_OUTPUT
        echo "- ${SUBJECT}" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
    
    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.base_version }}.${{ steps.version.outputs.build_number }}
        name: Build ${{ steps.version.outputs.build_number }}
        # 保持简短：只列本次更新内容，不堆砌构建元信息
        body: |
          ${{ steps.release_notes.outputs.notes }}
        files: build/app/outputs/flutter-apk/app-release.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
